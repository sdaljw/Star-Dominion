  original_text: "第二章：82年的拉菲与第一滴血\n________________________________________\n【第9527号新人试炼区\
    \ · 荒芜戈壁】 【新人领主历第一天 08:05】\n干热。 这是灵汐落地的第一感觉。 粗糙的砂砾被狂风卷起，打在脸上生疼。放眼望去，四周全是赤红色的岩石和枯黄的荆棘，头顶的太阳毒辣得像个大火球。\n\
    “真是……地狱开局啊。” 灵汐眯着眼，迅速观察四周。这里别说海了，连滴水都看不见。 周围的空气中弥漫着淡淡的硫磺味，远处时不时传来不知名野兽的嘶吼声。\n\
    【系统提示：您已抵达出生点。】 【新手保护罩已开启（持续时间：7天）。】 【请尽快激活领主核心，建立初始领地。】\n灵汐没有犹豫，从背包里取出老李发的那枚领主核心，用力按在脚下的沙地上。\
    \ “展开。”\n嗡—— 一道白光以此为圆心扩散，原本松软的沙地瞬间硬化。几秒钟后，一座简陋得有些寒酸的【领主木屋】拔地而起。 这就是所有新人的起跑线。\n\
    灵汐推门走进木屋，甚至没看一眼那张破旧的木床，直接打开了那张只有她能看见的【碧蓝航线指挥界面】。\n面板上，资源一栏红得刺眼：\n•\t物资（金币）：600\n\
    •\t石油：0\n•\t心智魔方：1\n•\t快速建造工具：1\n•\t解锁建筑：建造台\n“没有石油……”灵汐叹了口气。 在这个世界，石油不仅是燃料，更是舰娘们的“法力值”和“饱腹度”。没有油，舰娘就无法具象化舰装，甚至连炮都开不出来。\
    \ 但她不能等。 外面的嘶吼声越来越近，显然有魔物在蹲守新手保护罩消失的那一刻。\n先点开建造台看看需要什么吧，当务之急是把拉菲召唤出来\n【建造台】\n\
    木材*50，石头*50\n“当务之急，是先把拉菲召唤出来。\n她看了一眼空荡荡的背包，叹了口气，卷起袖子，拿起新手赠送的生锈斧头和镐子。\n“S级天赋又怎样，开局还不是得亲自撸树。”\n\
    灵汐卷起袖子，从新手礼包中取出一把边缘卷刃的【粗糙铁斧】。 虽然有系统辅助，但这把斧头沉甸甸的分量却是实打实的。\n她走到木屋旁一株枯死的荆棘灌木前，深吸一口气，双手举起斧头，用力劈下。\n\
    “咔嚓！” 一声脆响，干燥的枯木应声断裂。 神奇的一幕发生了——并没有木屑飞溅，断裂的灌木在倒地的瞬间化作了一团微弱的白光，直接钻进了灵汐腰间的领主终端里。\n\
    【系统提示：获得劣质木材 x1】 【当前进度：木材 1/50】\n“只要破坏结构判定，就能自动拾取吗？这倒是个好消息。” 灵汐甩了甩被反震得发麻的手腕，看了一眼满地的碎石和枯木，眼神坚定。\
    \ 开工！”\n……\n【半小时后】\n戈壁滩的日头越升越高，毒辣的阳光像鞭子一样抽打在每一寸裸露的皮肤上。空气中只有粗重的喘息声和斧头撞击硬物的闷响。\n\
    灵汐的动作已经没有了刚开始的利落。 她浑身被汗水湿透，银色的发丝黏在脸颊上，每一次挥动斧头都需要调动全身的力气。虽然虚拟背包免去了负重的痛苦，但高强度的劳作对于一个刚刚成年的高中女生来说，依然是不小的负担。\n\
    “呼……呼……” 灵汐撑着膝盖，视线有些模糊。 她低头看了一眼自己的手掌，原本白皙细嫩的掌心此刻已经被粗糙的斧柄磨出了几个晶莹的水泡，虎口处更是一片红肿，传来火辣辣的刺痛。\n\
    但她没有停下。 因为在视网膜的右下角，那个任务进度条已经变成了令人欣慰的绿色。\n【木材：50/50（已完成）】\n 【石材：47/50】\n“还差……最后一个。”\n\
    灵汐强撑着直起腰，目光锁定脚边一块被风化得棱角分明的岩石。 岩石表面被暴晒得滚烫，指尖触碰的瞬间传来一阵灼烧感。她咬着牙，忍着掌心的剧痛，双手用力将稿子挥下。\n\
    随着岩石四分五裂—— 唰！ 白光一闪，地下的碎石块瞬间消失。\n【系统提示：获得石材 x3】 【当前进度：石材 50/50】 【收集任务完成！】\n看到那个绿色的“完成”字样跳动，灵汐紧绷的神经终于松弛下来，整个人虚脱般地晃了晃，一屁股坐在了滚烫的沙地上。\n\
    “终于……凑齐了。” 她大口喘着气，意念一动，打开虚拟背包面板。 看着格子里整整齐齐叠放的**【木材x50】和【石材x50】**，一种难以言喻的满足感油然而生。\
    \ 虽然累，虽然痛，但这种通过双手将世界装进口袋的感觉……还不赖。\n灵汐拧开水瓶，珍惜地抿了一小口水润了润干裂的喉咙，随后眼神重新变得锐利。 “材料就位。”\
    \ “接下来……就是见证奇迹的时刻了。”\n她站起身，拍了拍身上的尘土，朝着木屋走去。 而在她意识深处，那张**【建造台】**的图纸已经亮起，等待着被具象化的那一刻。\n\
    灵汐抹了抹脸上的汗，“系统，建造建造台”\n【消耗：木材x50，石材x50】\n【建造中……建造台完成！】\n一座充满科幻感的金属操作台在木屋角落生成。灵汐没有休息，立刻拿出胸口那枚滚烫的心智魔方。\n\
    “出来吧，我的初始舰。”\n【消耗：物资x600，心智魔方x1】\n【建造时间：00:27:00】\n【使用快速建造工具！】\n叮！\n金色的光芒炸裂，无数粉色的樱花瓣在干燥的木屋中凭空飘落，一股淡淡的酒精味混合着清甜的沐浴露香气扑面而来。\n\
    一个娇小的身影出现在光芒中。\n白色的双马尾，慵懒半垂的红色眼眸，粉白色的宽松外套滑落在肩头。她手里提着半瓶红酒形状的液体，整个人摇摇晃晃，仿佛下一秒就要睡着。\n\
    “指挥官……我是拉菲。”\n“嗯……如果是为了指挥官，我会努力的……大概。”\n“现在……可以睡觉了吗？”\n灵汐看着眼前这个软萌的女孩，眼神温柔：“欢迎回家，拉菲。”\n\
    她调出面板：\n【单位：拉菲（Laffey）】\n【稀有度：SR（精锐）】\n【等级：Lv.1】\n【状态：油料枯竭（全属性下降50%，无法展开主炮射击，无法开启护盾）】\n\
    【武器：双联装127mm高平两用炮（物理形态）】\n“没有油，属性减半么……”灵汐摸了摸拉菲的头，“拉菲，现在没有酒喝，只能委屈你先用力气干活了。”\n拉菲蹭了蹭灵汐的手心，打了个哈欠：“没有酒……没有动力……但如果有敌人打扰睡觉……”\n\
    她红色的眸子里闪过一丝危险的光：“拉菲，会生气。”\n嘶——！\n话音刚落，一只体长两米的**【赤尾岩蝎】（Lv.1）**猛地撞击在保护罩上！\n“干活了。”灵汐推门而出。\n\
    拉菲慢吞吞地跟在后面。\n那只蝎子兴奋地扑了上来，巨大的尾刺泛着毒光。\n“小心！”灵汐下意识喊道。\n然而，拉菲连头都没抬。\n咔嚓！\n只见她那看似柔弱的小手，不知何时具象化出了一根巨大的、充满金属质感的双联装炮管。\n\
    因为没有油，这门炮就是一坨数吨重的实心钢铁。\n拉菲单手拎着比她人还大的炮管，就像拎着一根棒球棍。\n“好吵。”\n她抡圆了，直接砸了下去。\n嘭！！！\n\
    一声闷响，大地颤抖。\n没有什么技巧，就是纯粹的力大砖飞。\n那只气势汹汹的岩蝎连惨叫都没发出来，直接被砸成了一滩肉泥。\n【击杀Lv.1 赤尾岩蝎，获得经验+10】\n\
    【拉菲升级：Lv.1 -> Lv.2】\n灵汐看着地上的深坑，眼角抽搐了一下。\n这就叫……装逼就让你飞起来？\n谁说舰娘没油就是废铁？这分明是人形自走打桩机！\n\
    ……\n【12:00】\n“轰！轰！轰！”\n接下来的两个小时，方圆五百米内的戈壁滩遭遇了毁灭性打击。\n拉菲扛着舰装，化身拆迁办拉主任。\n【沙暴响尾蛇（Lv.1）】——砸扁。\n\
    【硬皮蜥蜴（Lv.2）】——砸碎。\n【风化岩石山】——拆掉。\n拉菲虽然没油开炮，但她那一身钢铁舰装的重量和硬度，对于新手村的小怪来说就是大运。想创谁创谁\n\
    灵汐跟在后面，背包里很快就塞满了【魔核】、【蝎壳】和各种各样的肉。\n“拉菲，累吗？”灵汐递过去一瓶自己喝剩的水。\n拉菲小脸红扑扑的，额头上满是汗珠，她接过水喝了一小口，有些蔫蔫地靠在灵汐身上：“指挥官……好热……想泡澡。”\n\
    灵汐看着头顶毒辣的太阳，心疼不已。\n舰娘虽然强大，但也是血肉之躯，而且她们的舰装散热需要大量的水。\n“马上就有水了。”\n灵汐拿出了老李给的那张绿色图纸。\n\
    【建筑图纸：深水之井】\n【需求：石料x50，木材x20】\n“材料齐了。”\n灵汐在木屋旁选了个位置，使用了图纸。\n嗡——\n地面裂开，一座石质的深井自动成型。几秒钟后，清冽的地下水声响起。\n\
    灵汐摇动把手，一桶冰凉清澈的地下水被提了上来。\n“哇……”拉菲的眼睛亮了。\n她迫不及待地捧起水泼在脸上，发出了舒服的哼哼声：“复活了……”\n灵汐看着这一幕，握紧了拳头。\n\
    第一天，虽然狼狈，虽然没油，但她们活下来了，而且拥有了水源。\n“拉菲，今晚好好睡一觉。”\n“我们的领主之路，才刚刚开始。”\n【第一天结束结算】\n【拉菲等级：Lv.3】\n\
    【获得资源：水井x1，基础材料若干，魔核x5】\n"
